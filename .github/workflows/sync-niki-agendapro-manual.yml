name: Sync Niki AgendaPro

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Modo de sincronización"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - rolling
          - historical

      sync_from:
        description: "Desde (YYYY-MM-DD) - solo para historical"
        required: false
        type: string

      sync_to:
        description: "Hasta (YYYY-MM-DD) - solo para historical"
        required: false
        type: string

  schedule:
    # Durante el día: cada hora de 08:15 a 23:15
    - cron: "15 8-23 * * *"
      timezone: "America/Argentina/Buenos_Aires"

    # Reconciliación nocturna: últimos 10 días
    - cron: "30 3 * * *"
      timezone: "America/Argentina/Buenos_Aires"

concurrency:
  group: sync-niki-agendapro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Resolve sync mode
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYNC_MODE="${{ inputs.sync_mode }}"

            if [ "$SYNC_MODE" = "historical" ]; then
              SYNC_FROM="${{ inputs.sync_from }}"
              SYNC_TO="${{ inputs.sync_to }}"

              if [ -z "$SYNC_FROM" ] || [ -z "$SYNC_TO" ]; then
                echo "Para historical tenés que completar Desde y Hasta."
                exit 1
              fi

              echo "SYNC_FROM=$SYNC_FROM" >> "$GITHUB_ENV"
              echo "SYNC_TO=$SYNC_TO" >> "$GITHUB_ENV"
              echo "Rango histórico: $SYNC_FROM -> $SYNC_TO"
            fi

          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            SYNC_MODE="rolling"

          else
            SYNC_MODE="today"
          fi

          echo "SYNC_MODE=$SYNC_MODE" >> "$GITHUB_ENV"
          echo "Modo de sincronización: $SYNC_MODE"

      - name: Run AgendaPro multilocal sync
        env:
          AGENDAPRO_USER: ${{ secrets.AGENDAPRO_USER }}
          AGENDAPRO_PASSWORD: ${{ secrets.AGENDAPRO_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python sync_niki_agendapro_multilocal.py
