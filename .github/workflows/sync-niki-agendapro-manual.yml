name: Sync Niki AgendaPro

on:
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Modo de sincronización"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - rolling
          - historical
          - expenses_only

      sync_from:
        description: "Desde (YYYY-MM-DD) - para historical o expenses_only"
        required: false
        type: string

      sync_to:
        description: "Hasta (YYYY-MM-DD) - para historical o expenses_only"
        required: false
        type: string

  schedule:
    # Durante el día: cada hora de 08:15 a 23:15
    - cron: "15 8-23 * * *"
      timezone: "America/Argentina/Buenos_Aires"

    # Reconciliación nocturna: últimos 10 días
    - cron: "30 3 * * *"
      timezone: "America/Argentina/Buenos_Aires"

concurrency:
  group: sync-niki-agendapro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Resolve sync mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SYNC_MODE: ${{ inputs.sync_mode }}
          INPUT_SYNC_FROM: ${{ inputs.sync_from }}
          INPUT_SYNC_TO: ${{ inputs.sync_to }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SYNC_MODE="${INPUT_SYNC_MODE:-today}"
            case "$SYNC_MODE" in
              today|rolling) ;;
              historical|expenses_only)
                SYNC_FROM="${INPUT_SYNC_FROM:-}"
                SYNC_TO="${INPUT_SYNC_TO:-}"
                if [[ ! "$SYNC_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ ! "$SYNC_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                  echo "Para historical o expenses_only completá Desde y Hasta en formato YYYY-MM-DD."
                  exit 1
                fi
                printf 'SYNC_FROM=%s\nSYNC_TO=%s\n' "$SYNC_FROM" "$SYNC_TO" >> "$GITHUB_ENV"
                echo "Rango: $SYNC_FROM -> $SYNC_TO"
                ;;
              *) echo "Modo de sincronización inválido"; exit 1 ;;
            esac
          elif [ "$EVENT_SCHEDULE" = "30 3 * * *" ]; then
            SYNC_MODE="rolling"
          else
            SYNC_MODE="today"
          fi

          printf 'SYNC_MODE=%s\n' "$SYNC_MODE" >> "$GITHUB_ENV"
          echo "Modo de sincronización: $SYNC_MODE"

      - name: Run AgendaPro multilocal sync
        env:
          AGENDAPRO_USER: ${{ secrets.AGENDAPRO_USER }}
          AGENDAPRO_PASSWORD: ${{ secrets.AGENDAPRO_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_EXPENSES: "true"
          EXPENSE_ROLLING_DAYS: "45"
        run: |
          python sync_niki_agendapro_multilocal.py

      - name: Guardar diagnóstico de horarios de AgendaPro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agendapro-horarios-diagnostico
          path: agendapro_booking_schema.json
          if-no-files-found: ignore
          retention-days: 7
